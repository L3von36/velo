name: Build Velo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Decode release keystore
        working-directory: flutter_app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/velo-release.jks

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build signed release APK
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/velo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build iOS (no codesign)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: flutter_app
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -qry velo-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-ios-unsigned-ipa
          path: flutter_app/build/ios/velo-ios-unsigned.ipa

  build-web:
    name: Flutter Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build web
        working-directory: flutter_app
        run: flutter build web --release --base-href /velo/ --pwa-strategy=none

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-web-dist
          path: flutter_app/build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true

  build-windows:
    name: Windows EXE
    # windows-2025 image lacks the Win10 SDK component Flutter needs, pin 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build Windows release
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Zip release folder
        working-directory: flutter_app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath velo-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-windows-x64
          path: flutter_app/velo-windows-x64.zip
