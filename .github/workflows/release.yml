name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Detect signing config
    runs-on: ubuntu-latest
    outputs:
      ios_signed: ${{ steps.check.outputs.signed }}
    steps:
      - id: check
        env:
          HAS_P12: ${{ secrets.IOS_P12_BASE64 != '' }}
        run: echo "signed=$HAS_P12" >> "$GITHUB_OUTPUT"

  build-android:
    name: Android (signed APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Decode release keystore
        working-directory: flutter_app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/velo-release.jks

      - name: Build signed APK + AAB
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/velo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VER"
          flutter build appbundle --release --build-name="$VER"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  build-ios-unsigned:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    # Unsigned fallback used until Apple signing secrets are configured
    needs: config
    if: needs.config.outputs.ios_signed != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build iOS (no codesign)
        working-directory: flutter_app
        run: |
          VER="${GITHUB_REF_NAME#v}"
          flutter build ios --release --no-codesign --build-name="$VER"

      - name: Package unsigned IPA
        working-directory: flutter_app
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -qry velo-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-ios-unsigned-ipa
          path: flutter_app/build/ios/velo-ios-unsigned.ipa

  build-ios-testflight:
    name: iOS TestFlight (signed)
    runs-on: macos-latest
    # Runs automatically once these repo secrets are set:
    #   IOS_P12_BASE64 / IOS_P12_PASSWORD          - Apple distribution cert (.p12)
    #   IOS_PROVISION_PROFILE_BASE64               - App Store provisioning profile
    #   APPLE_TEAM_ID                              - 10-char Team ID
    #   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID /
    #   APPSTORE_API_PRIVATE_KEY                   - App Store Connect API key (.p8)
    needs: config
    if: needs.config.outputs.ios_signed == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      - name: Create ExportOptions.plist
        working-directory: flutter_app
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        working-directory: flutter_app
        run: |
          VER="${GITHUB_REF_NAME#v}"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --export-method app-store --build-name="$VER"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-ios-ipa
          path: flutter_app/build/ios/ipa/velo.ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: flutter_app/build/ios/ipa/velo.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

  build-web:
    name: Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build web
        working-directory: flutter_app
        run: flutter build web --release --base-href /velo/ --pwa-strategy=none

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-web-dist
          path: flutter_app/build/web

  build-windows:
    name: Windows EXE
    # windows-2025 image lacks the Win10 SDK component Flutter needs, pin 2022
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2
          cache: true

      - name: Apply launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build Windows release
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Zip release folder
        working-directory: flutter_app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath velo-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: velo-windows-x64
          path: flutter_app/velo-windows-x64.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [config, build-android, build-ios-unsigned, build-ios-testflight, build-web, build-windows]
    if: >-
      ${{ !cancelled() &&
          needs.build-android.result == 'success' &&
          needs.build-web.result == 'success' &&
          needs.build-windows.result == 'success' &&
          (needs.build-ios-unsigned.result == 'success' || needs.build-ios-testflight.result == 'success') }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: velo-*
          path: dist

      - name: Package release assets
        env:
          VER: ${{ github.ref_name }}
        run: |
          (cd dist/velo-web-dist && zip -qry ../velo-web-dist.zip .)
          rm -rf dist/velo-web-dist
          mkdir -p assets
          cp dist/velo-android-apk/app-release.apk        "assets/velo-${VER}.apk"
          cp dist/velo-android-aab/app-release.aab        "assets/velo-${VER}.aab"
          if [ -d dist/velo-ios-ipa ]; then
            cp dist/velo-ios-ipa/velo.ipa                 "assets/velo-${VER}-ios.ipa"
          else
            cp dist/velo-ios-unsigned-ipa/velo-ios-unsigned.ipa "assets/velo-${VER}-ios-unsigned.ipa"
          fi
          cp dist/velo-windows-x64/velo-windows-x64.zip   "assets/velo-${VER}-windows-x64.zip"
          cp dist/velo-web-dist.zip                       "assets/velo-${VER}-web.zip"
          ls -la assets

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ github.ref_name }}
        run: |
          gh release create "$VER" \
            --title "Velo ${VER#v}" \
            --generate-notes \
            assets/* || gh release upload "$VER" assets/* --clobber
